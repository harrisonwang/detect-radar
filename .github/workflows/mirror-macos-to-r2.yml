name: Mirror macOS Release to R2

on:
  workflow_call:
    inputs:
      tag:
        description: 'Published macOS release tag to mirror, for example macos-v0.1.0'
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published macOS release tag to mirror, for example macos-v0.1.0'
        required: true
        type: string
  pull_request:
    paths:
      - 'macos/scripts/mirror_to_r2.py'
      - 'macos/scripts/test_mirror_to_r2.py'
      - 'macos/scripts/requirements-mirror.txt'
      - '.github/workflows/mirror-macos-to-r2.yml'
  push:
    branches: [main]
    paths:
      - 'macos/scripts/mirror_to_r2.py'
      - 'macos/scripts/test_mirror_to_r2.py'
      - 'macos/scripts/requirements-mirror.txt'
      - '.github/workflows/mirror-macos-to-r2.yml'

permissions:
  contents: read

concurrency:
  group: macos-r2-mirror-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_call') && github.event.repository.default_branch || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: macos/scripts/requirements-mirror.txt
      - run: python -m pip install -r macos/scripts/requirements-mirror.txt
      - run: python -m unittest discover -s macos/scripts -p 'test_*.py' -v

  mirror:
    if: >-
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'macos-v'))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Release tags can predate this workflow. Always use the maintained mirror implementation.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: macos/scripts/requirements-mirror.txt
      - run: python -m pip install -r macos/scripts/requirements-mirror.txt
      - name: Mirror and verify immutable macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'detectradar-releases' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://dl.detectradar.com' }}
        run: python macos/scripts/mirror_to_r2.py --tag "$RELEASE_TAG"
