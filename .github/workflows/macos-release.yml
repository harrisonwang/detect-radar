name: Release macOS App

on:
  push:
    tags:
      - 'macos-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build Universal .app, DMG, and checksums
        id: build
        env:
          ARCH: universal
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/macos-v') && github.ref_name || 'macos-v0.1.0' }}
        run: |
          set -euo pipefail
          raw_version="${RELEASE_TAG#macos-v}"
          bundle_version="${raw_version%%-*}"
          dmg_name="DetectRadarBar-v${raw_version}-macos-universal.dmg"
          if [[ "$raw_version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          VERSION="$bundle_version" DMG_NAME="$dmg_name" ./scripts/build-app.sh

          rm -rf dist/release
          mkdir -p dist/release
          cp "dist/$dmg_name" "dist/release/$dmg_name"
          cp ../LICENSE dist/release/LICENSE
          (
            cd dist/release
            shasum -a 256 "$dmg_name" LICENSE > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/macos-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.build.outputs.prerelease == 'true' }}
          files: |
            macos/dist/release/DetectRadarBar-v*-macos-universal.dmg
            macos/dist/release/LICENSE
            macos/dist/release/SHA256SUMS.txt

  mirror-to-r2:
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: build-and-release
    uses: ./.github/workflows/mirror-macos-to-r2.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
