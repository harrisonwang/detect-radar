# 构建四个镜像（server/web/setup/cloud-ip-crawler）并推送至 GHCR。
# 触发：打 v* 标签（推语义版本号 + latest），或手动 dispatch（只推 latest）。
name: docker-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: detect-radar-server
            dockerfile: deploy/images/server.Dockerfile
          - name: detect-radar-web
            dockerfile: deploy/images/web.Dockerfile
          - name: detect-radar-setup
            dockerfile: deploy/images/setup.Dockerfile
          - name: cloud-ip-crawler
            dockerfile: deploy/images/crawler.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算标签与构建参数
        id: meta
        run: |
          VERSION=latest
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF#refs/tags/v}" ;;
          esac
          TAGS="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.name }}:${VERSION}"
          if [ "$VERSION" != latest ]; then
            TAGS="$TAGS,ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.name }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # DB-IP Lite 按月出包，当月 404 时 Dockerfile 会回退上月
          echo "dbip_month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "dbip_month_prev=$(date -d '-1 month' +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            DBIP_MONTH=${{ steps.meta.outputs.dbip_month }}
            DBIP_MONTH_PREV=${{ steps.meta.outputs.dbip_month_prev }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
